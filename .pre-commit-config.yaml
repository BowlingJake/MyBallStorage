# Pre-commit hooks for Flutter/Dart projects
# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: flutter-format
        name: Flutter Format
        entry: dart format --set-exit-if-changed .
        language: system
        types: [dart]
        
      - id: flutter-analyze
        name: Flutter Analyze
        entry: flutter analyze --fatal-infos
        language: system
        types: [dart]
        pass_filenames: false
        
      - id: dart-test
        name: Dart Test (Quick)
        entry: flutter test test/routing/
        language: system
        types: [dart]
        pass_filenames: false 